[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
# Runtime-agnostic: safe for the hub (wasm32) and everything it uses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
# Native crates only (runner, sidecar, cli, client-*). Never in hub or protocol.
tokio = { version = "1", features = ["full"] }
agent-client-protocol = { version = "3", default-features = false }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
