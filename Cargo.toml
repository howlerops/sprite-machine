[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
# Runtime-agnostic: safe for the hub (wasm32) and everything it uses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
# Native crates only (runner, sidecar, cli, client-*). Never in hub or protocol.
tokio = { version = "1", features = ["full"] }
agent-client-protocol = { version = "3", default-features = false }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Desktop UI (client-gpui only). gpui-component/gpui-kit are pinned by git rev; gpui is the
# exact `gpui-pre` snapshot that rev is built against (see its Cargo.toml). Bump together,
# re-vendor docs/vendor/gpui-component-<rev>/ and re-run scripts/gpui-render-proof.sh.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "c8917c3661ed1090870f403c312b39e0d8a62e0b" }
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "c8917c3661ed1090870f403c312b39e0d8a62e0b" }

[profile.dev]
debug = "line-tables-only"

# The hub Worker bundle (`worker-build --profile wasm-release`, see crates/hub/wrangler.toml).
# Size settings from docs/spikes/cloudflare.md: 487,908-byte wasm in the spike against
# 1.49 MB with plain release. A named profile, not [profile.release], so native release builds
# of the other crates keep their settings. `strip = true` breaks worker-build 0.8.7.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = false

[profile.dev.package."*"]
opt-level = 1
