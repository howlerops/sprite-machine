name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fly-web-control-plane:
    name: Deploy web + control-plane to Fly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sprite-machine/control-plane typecheck
      - run: pnpm --filter @sprite-machine/mobile typecheck
      - run: pnpm --filter @sprite-machine/control-plane build
      - run: pnpm --filter @sprite-machine/mobile export:web
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  eas-update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    needs: fly-web-control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sprite-machine/mobile typecheck
      - name: Validate Expo token
        id: expo-token
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not set; skipping EAS Update."
            exit 0
          fi
          if npx eas-cli whoami --non-interactive >/dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is invalid; skipping EAS Update. Create a token at https://expo.dev/settings/access-tokens and update the GitHub secret."
          fi
      - name: Publish preview update
        if: steps.expo-token.outputs.valid == 'true'
        run: npx eas-cli update --channel preview --message "${{ github.event.head_commit.message || 'Manual preview update' }}" --non-interactive
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 1
