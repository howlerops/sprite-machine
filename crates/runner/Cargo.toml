[package]
name = "runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The `sm` runner: host modes (local, sandbox), tunnel client, TUI, pairing, server mode."

[[bin]]
name = "sm"
path = "src/main.rs"

[features]
# TEST ONLY: `server::run_with_file_policy`, which takes the loopback attachment policy. Only the
# e2e check (`cli e2e attachments`) enables it; `sm` never does.
test-support = ["sidecar/test-support"]

[dependencies]
protocol = { path = "../protocol" }
sidecar = { path = "../sidecar" }
anyhow.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# wss:// (tunnel.md §2). ring is the provider; no native-tls / openssl anywhere in the tree.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rand = "0.9"
# `sm login` (M2B-005): the pairing QR rendered as unicode text (no image deps).
qrcode = { version = "0.14", default-features = false }

# The macOS Keychain for the machine credential (M2B-005). Platform-native only, no default
# features: no openssl, no libdbus. Linux keeps the credential in the 0600 file (keyutils is lost
# at reboot).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# logind PrepareForSleep (sleep/linux.rs). No default features: no async-io, so no second runtime.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
# Schema check of the Checkpoint event. Same pin as crates/protocol.
jsonschema = { version = "=0.60.2", default-features = false }
tempfile = "3"
acp-mock = { path = "../acp-mock" }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
