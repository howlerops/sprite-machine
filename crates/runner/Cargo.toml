[package]
name = "runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The `sm` runner: host modes (local, sandbox), tunnel client, TUI, pairing, server mode."

[[bin]]
name = "sm"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
sidecar = { path = "../sidecar" }
anyhow.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
rand = "0.9"

[dev-dependencies]
# Schema check of the Checkpoint event. Same pin as crates/protocol.
jsonschema = { version = "=0.60.2", default-features = false }
tempfile = "3"
acp-mock = { path = "../acp-mock" }
