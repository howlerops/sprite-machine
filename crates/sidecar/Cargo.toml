[package]
name = "sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Runner core library: ACP client, bridge, durable store, host modes, keepalive, checkpoints, previews."

[dependencies]
protocol = { path = "../protocol" }
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Client terminals (ACP terminal/*) run on a PTY. Sync API; the reader and waiter run on
# std threads so the tokio runtime never blocks.
portable-pty = "=0.9.0"

[dev-dependencies]
acp-mock = { path = "../acp-mock" }
# Golden tests validate every emitted envelope against crates/protocol/schemas/turn-event.
# Same pin as crates/protocol.
jsonschema = { version = "=0.60.2", default-features = false }
tempfile = "3"
