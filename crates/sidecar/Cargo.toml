[package]
name = "sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Runner core library: ACP client, bridge, durable store, host modes, keepalive, checkpoints, previews."

[dependencies]
protocol = { path = "../protocol" }
anyhow.workspace = true
rusqlite = { version = "0.41.0", features = ["bundled"] }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest.workspace = true
# Attachments (bridge::files): base64 for image blocks, sha256 for the optional file digest.
base64 = "=0.22.1"
sha2 = "0.10"
# Client terminals (ACP terminal/*) run on a PTY. Sync API; the reader and waiter run on
# std threads so the tokio runtime never blocks.
portable-pty = "=0.9.0"
# Capability-based directory handle: fs/* resolve every path component relative to an opened
# root directory and refuse escapes, so a symlink swapped in mid-operation cannot leave the root.
cap-std = "=4.0.3"

# Signals for terminal/kill (process-group SIGHUP, then SIGKILL). Same version portable-pty
# already pulls in; only the `signal` feature, safe API, no `unsafe`.
[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", default-features = false, features = ["signal"] }

[dev-dependencies]
acp-mock = { path = "../acp-mock" }
# Golden tests validate every emitted envelope against crates/protocol/schemas/turn-event.
# Same pin as crates/protocol.
jsonschema = { version = "=0.60.2", default-features = false }
tempfile = "3"
