[package]
name = "hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The hub Cloudflare Worker (wasm32, no tokio): routes and Durable Objects (thread, machine, flow), D1, R2, queues."

# cdylib for worker-build (wasm32); rlib so `cargo test -p hub` builds natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
# Session-token hashing (only the SHA-256 is stored) and token entropy. `js` makes getrandom
# use the Workers `crypto.getRandomValues` on wasm32-unknown-unknown; it is a no-op natively.
sha2 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
# Signed attachment URLs (M2-009): HMAC-SHA256 with a constant-time check. Already in the lock file.
hmac = "0.12"
# Web Push (M2-011): RFC 8291 message encryption (ECDH P-256, HKDF-SHA256, AES-128-GCM) and
# RFC 8292 VAPID (ES256). Pure Rust, so they build for wasm32-unknown-unknown.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "arithmetic"] }
hkdf = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"

[features]
# Integration tests that need a running hub (HUB_URL). Off by default, so `cargo test -p hub`
# stays a plain native run. `scripts/hub-test.sh <name>` turns it on.
live = []

[dev-dependencies]
# The native SQLite fake for the D1 schema tests (tests/d1_schema.rs). It runs the same
# migration files the Worker runs on D1. Dev/test only: never in the wasm32 Worker or the
# native lib. Same version and bundling as client-core, so the lock file gains no new crate.
rusqlite = { version = "0.41.0", features = ["bundled"] }

[[test]]
name = "smoke"
required-features = ["live"]

[[test]]
name = "thread_do"
required-features = ["live"]

[[test]]
name = "authz"
required-features = ["live"]

[[test]]
name = "thread_session"
required-features = ["live"]

[[test]]
name = "machine_do"
required-features = ["live"]

[[test]]
name = "attachments"
required-features = ["live"]

[[test]]
name = "devices"
required-features = ["live"]

[[test]]
name = "notify"
required-features = ["live"]

[[test]]
name = "presence_notify"
required-features = ["live"]

[[test]]
name = "tasks"
required-features = ["live"]

[[test]]
name = "links"
required-features = ["live"]

[[test]]
name = "signin"
required-features = ["live"]

# Native (no `live` feature): redaction, bounded catch-up and state compaction over ThreadCore.
[[test]]
name = "thread_hardening"

# Workers glue (spike M0-017 pins). wasm32 only, so native builds and tests stay plain Rust.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.7", features = ["http", "axum", "d1", "queue"] }
worker-macros = { version = "=0.8.7", features = ["http"] }
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3"

[[test]]
name = "subscribe_ticket"
required-features = ["live"]

[[test]]
name = "oauth"
required-features = ["live"]
