# Hub Worker. The top-level config is for local runs (`cargo run -p cli -- e2e tracer`,
# `scripts/hub-test.sh`, `wrangler dev --local`): its ids and names are placeholders. Production is
# `[env.production]` at the end of this file, deployed by .github/workflows/deploy-hub.yml
# (`wrangler deploy --env production`, docs/ops/hub.md). Wrangler does not inherit bindings, vars,
# triggers or migrations into an environment, so the section repeats them: keep both in step.
name = "sm-hub"
main = "build/index.js"
compatibility_date = "2026-10-01"

# M2-010: app-site association (crates/hub/src/links.rs). Empty means no document is served
# (404), so nothing is claimed for an app that is not configured. Set the real values per
# environment: the team id and bundle id for the iOS app, the package name and the comma-separated
# SHA-256 certificate fingerprints for the Android app.
[vars]
# Deep links (M2-010): empty = the association documents are 404.
APPLE_TEAM_ID = ""
APPLE_BUNDLE_ID = ""
ANDROID_PACKAGE_NAME = ""
ANDROID_SHA256_CERT_FINGERPRINTS = ""
# Web Push (M2-011). Dev placeholder only: the public half of a throwaway VAPID key, there so a client can be tried
# against `wrangler dev`. The hub derives the real public key from the secret VAPID_PRIVATE_KEY
# (base64url, 32-byte P-256 scalar; set with `wrangler secret put`, never in this file) and serves
# it at GET /v1/push/vapid-public-key; this var is only the answer when no secret is set.
VAPID_PUBLIC_KEY = "BDev-placeholder-not-a-real-key-replace-with-the-public-key-of-VAPID_PRIVATE_KEY"
# The `sub` claim of the VAPID JWT: a contact for the push service operators.
VAPID_SUBJECT = "mailto:push@sprite-machine.invalid"

[build]
# The `wasm-release` profile (root Cargo.toml: opt-level "z", lto, codegen-units 1, strip off;
# `strip` breaks worker-build 0.8.7, see docs/spikes/cloudflare.md). Then `cli wasm strip-names`
# drops the `name` and `producers` custom sections (MVP-000f, docs/spikes/hub-size.md). wrangler dev
# reruns this command, so it never runs cargo: it calls a prebuilt cli binary by path. The scripts
# (scripts/hub-test.sh, web/tests/helpers-hub.sh, the tracer) build cli before wrangler starts and
# set HUB_STRIP_BIN to a per-run copy. A manual `wrangler dev` needs `cargo build -q -p cli` first;
# without HUB_STRIP_BIN it uses ${CARGO_TARGET_DIR:-../../target}/debug/cli.
command = "env ${HUB_WASM_TARGET_DIR:+CARGO_TARGET_DIR=$HUB_WASM_TARGET_DIR} worker-build --profile wasm-release && ${HUB_STRIP_BIN:-${CARGO_TARGET_DIR:-../../target}/debug/cli} wasm strip-names build/index_bg.wasm"

# ---- Durable Objects (SQLite-backed: a class cannot switch storage later) -------------------

# WORKSPACE: the Workspace DO of workers/workspace (M0-008a), bound from another Worker by
# namespace (script_name). Its class has its own migrations there, so none here.
# Rust side: crates/hub/src/workspace_do (M0-008b).
[[durable_objects.bindings]]
name = "WORKSPACE"
class_name = "WorkspaceDO"
script_name = "sm-workspace"

# Skeletons (crates/hub/src/do/mod.rs), filled in by M2-008, M2B-002 and the flow item.
[[durable_objects.bindings]]
name = "THREAD"
class_name = "Thread"

[[durable_objects.bindings]]
name = "MACHINE"
class_name = "Machine"

[[durable_objects.bindings]]
name = "FLOW"
class_name = "Flow"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TracerHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Thread", "Machine", "Flow"]

# MVP-000d: the tracer's in-memory hub is gone; its class is deleted.
[[migrations]]
tag = "v3"
deleted_classes = ["TracerHub"]

# ---- Cron Triggers --------------------------------------------------------------------------

# Hourly: purge expired device pairings and old rate-limit counters (devices::limits::purge).
[triggers]
crons = ["17 * * * *"]

# ---- D1, R2, Queues -----------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "sm-hub"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "sm-blobs"

[[queues.producers]]
binding = "NOTIFY"
queue = "sm-notify"

[[queues.consumers]]
queue = "sm-notify"
max_batch_size = 10
max_batch_timeout = 1
# A push service answering 5xx or 429 makes the consumer retry the message (M2-011).
max_retries = 5
retry_delay = 5

# ---- Static Assets: the mobile web page (plan §4.2) ----------------------------------------

[assets]
directory = "../../web"
binding = "ASSETS"
# WEB-004: the service worker, the manifest and the icons are the page's own files too.
# WEB-001: /pair, /pair/device and /#/... are one page (index.html, absolute asset paths): a
# navigation to /pair falls back to index.html. Everything else goes to the Worker first, except
# the page's own files, so the API (/v1), the /t/<id> deep-link redirect, the association documents,
# /healthz and any unknown path keep the Worker's answers (JSON 404), never the page.
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/", "!/index.html", "!/styles.css", "!/src/*", "!/pair", "!/pair/*", "!/sw.js", "!/manifest.webmanifest", "!/icons/*"]

# ---- Dev only -----------------------------------------------------------------------------

[env.dev.vars]
DEV_FIXTURES = "1"
# ATTACHMENT_SIGNING_KEY is never in config: production sets it as a Worker secret, and
# scripts/hub-test.sh passes a random per-run value with --var. With `wrangler dev --env dev`, pass
# `--var ATTACHMENT_SIGNING_KEY:$(openssl rand -hex 32)` yourself.

# ---- Production (M2-015) -----------------------------------------------------------------------
# Deployed by .github/workflows/deploy-hub.yml: `wrangler d1 migrations apply DB --remote --env
# production`, then `wrangler deploy --env production`. The Worker is named sm-hub-production.
# The resources are the ones in docs/ops/hub.md. Secrets (MASTER_KEY, BOOTSTRAP_OWNER_TOKEN,
# VAPID_PRIVATE_KEY, ATTACHMENT_SIGNING_KEY) are set with `wrangler secret put --env production`,
# never here. Needs the Workspace DO Worker `sm-workspace` (workers/workspace) deployed first.

[env.production]
# Same as the top-level [build] (a build command is not inherited into an environment).
build = { command = "env ${HUB_WASM_TARGET_DIR:+CARGO_TARGET_DIR=$HUB_WASM_TARGET_DIR} worker-build --profile wasm-release && ${HUB_STRIP_BIN:-${CARGO_TARGET_DIR:-../../target}/debug/cli} wasm strip-names build/index_bg.wasm" }
triggers = { crons = ["17 * * * *"] }

[env.production.vars]
APPLE_TEAM_ID = ""
APPLE_BUNDLE_ID = ""
ANDROID_PACKAGE_NAME = ""
ANDROID_SHA256_CERT_FINGERPRINTS = ""
# Replace with the public half of the production VAPID key (the hub derives it from the secret
# VAPID_PRIVATE_KEY when that is set, so this is only the fallback answer).
VAPID_PUBLIC_KEY = "BDev-placeholder-not-a-real-key-replace-with-the-public-key-of-VAPID_PRIVATE_KEY"
VAPID_SUBJECT = "mailto:push@sprite-machine.invalid"
# BOOTSTRAP_OWNER_GITHUB_LOGIN (optional, docs/ops/hub.md): add here to name the first owner.

[[env.production.durable_objects.bindings]]
name = "WORKSPACE"
class_name = "WorkspaceDO"
script_name = "sm-workspace"

[[env.production.durable_objects.bindings]]
name = "THREAD"
class_name = "Thread"

[[env.production.durable_objects.bindings]]
name = "MACHINE"
class_name = "Machine"

[[env.production.durable_objects.bindings]]
name = "FLOW"
class_name = "Flow"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["TracerHub"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["Thread", "Machine", "Flow"]

[[env.production.migrations]]
tag = "v3"
deleted_classes = ["TracerHub"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "sm-hub"
database_id = "6b65194f-4317-471b-a718-f89d8fdcfbeb"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "BLOBS"
bucket_name = "sm-hub-blobs"

[[env.production.queues.producers]]
binding = "NOTIFY"
queue = "sm-hub-notify"

[[env.production.queues.consumers]]
queue = "sm-hub-notify"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5
retry_delay = 5

[env.production.assets]
directory = "../../web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/", "!/index.html", "!/styles.css", "!/src/*", "!/pair", "!/pair/*", "!/sw.js", "!/manifest.webmanifest", "!/icons/*"]
