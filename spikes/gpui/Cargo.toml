[package]
name = "gpui-spike"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
description = "M1B-004a spike: gpui-kit app shell + virtualized transcript pane over the transcript-10k fixture."

# Standalone project, not a member of the root workspace.
[workspace]
resolver = "2"

[lib]
name = "gpui_spike"
path = "src/lib.rs"

[[bin]]
name = "gpui-spike"
path = "src/main.rs"

[dependencies]
protocol = { path = "../../crates/protocol" }
agui-fixture = { path = "../../crates/agui-fixture" }
# float_roundtrip: the feed's floats (usage cost) decode to the exact values the fixture encoded.
serde_json = { version = "1", features = ["float_roundtrip"] }
# M1B-008a: the fixture feed (blocking WebSocket client, run on a background thread).
tungstenite = "0.29"
# M1B-004d: the approval card's HTTP AnswerSink (blocking; called on the background executor).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# M1B-004c: the terminal pane's VT model (`Term` + the `vte` ANSI processor). Exact pin.
alacritty_terminal = "=0.26.0"
# Exactly the root [workspace.dependencies] specs (checked by tests/pins.rs).
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "c8917c3661ed1090870f403c312b39e0d8a62e0b" }
# `syntect`: syntax highlighting for the diff pane (regex highlighter, about 200 languages).
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "c8917c3661ed1090870f403c312b39e0d8a62e0b", features = ["syntect"] }

[dev-dependencies]
# M1B-004d: the approval integration test starts agui-fixture, which needs a tokio runtime.
tokio = { version = "1", features = ["full"] }
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "c8917c3661ed1090870f403c312b39e0d8a62e0b", features = ["test-support"] }

# Copied from the root Cargo.toml so the shared target dir's GPUI artifacts are reused.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
