  - id: M4-001
    title: 'Workspace image release pipeline: versioned tags, SBOM per version in R2, image versions in the hub'
    milestone: M4
    phase: P4
    size: M
    deps: [M0-008c, M2-016]
    paths:
      - 'crates/hub/src/images/**'
      - 'crates/hub/migrations/*image_versions*'
      - 'crates/hub/tests/images.rs'
      - 'crates/cli/src/image/**'
    context:
      - 'docs/PLAN-v2-ade.md §4.3 (Workspace lifecycle: Image, Fork)'
      - 'images/workspace/ and .github/workflows/workspace-image.yml (M0-008c builds the image; this item records and releases it)'
    acceptance:
      - 'A D1 migration adds an image_versions table (tag, digest, sbom_r2_key, created_at, is_default); the hub API lists versions and sets the default (admin only); new workspaces use the default, existing ones keep theirs until upgraded'
      - '`cargo run -p cli -- image release --check <manifest.json>` validates a CI release manifest (tag, registry digest, SBOM path) without network and prints the hub calls it would make; in CI it uploads the SBOM to R2 and registers the version'
      - 'Upgrading a workspace to a newer image version is a fork into a new sandbox on that image through M4-005 (not reimplemented here); this item only records which version each workspace runs'
    verify:
      - 'bash scripts/hub-test.sh images'
      - 'cargo run -p cli -- image release --check crates/cli/tests/fixtures/image-release.json'

  - id: M4-002
    title: 'hub: workspace create = Workspace DO start + egress allowlist + instance size + admission against account limits'
    milestone: M4
    phase: P4
    size: M
    deps: [M4-001, M2-002, M0-008b, M1A-016]
    paths:
      - 'crates/hub/src/workspaces/create*'
      - 'crates/hub/src/workspaces/admission*'
      - 'crates/hub/tests/workspaces.rs'
    context:
      - 'docs/PLAN-v2-ade.md §4.3 (Workspace lifecycle: Instance size, Egress, Limits & cost), §4.8'
      - 'https://developers.cloudflare.com/containers/platform-details/ (instance types, account limits)'
    acceptance:
      - 'POST /api/workspaces stores the workspace in D1 with its image version (M4-001) and instance type (standard-2 default; lite to standard-4 allowed; anything else 400), then starts the sandbox through WorkspaceControl with the runner (M1A-016); the runner machine is registered as an agent of kind managed'
      - 'Egress: an explicit per-workspace hostname allowlist is stored with the workspace and passed to the Workspace DO (`enableInternet: false`); an empty allowlist is allowed, defaults are never added'
      - 'Admission: the summed vCPU/memory of running sandboxes is checked against configured account limits (defaults 1,500 vCPU / 6 TiB); over the limit the request is queued and returns 429 with the queue position; tests use the WorkspaceControl fake'
    verify:
      - 'cargo test -p hub --test workspaces'

