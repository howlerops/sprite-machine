      - 'docs/spikes/sandbox-egress.md'
    acceptance:
      - 'Admin API binds a credential (a Secrets Store secret name, or an encrypted org credential from M2-002) to a workspace + hostname + path prefixes (e.g. api.github.com /repos/<org>/<repo>/*) with a header template; admin paths are blocked'
      - 'The Workspace DO outbound handler injects the header only for matching hostname + path, strips any client-supplied auth header, and refuses and logs non-allowlisted hosts; vitest covers matching and non-matching hosts and paths'
      - 'A test renders the sandbox start env and files and asserts no key-shaped value (sk-ant-…, ghp_…, or a non-placeholder *_API_KEY) reaches them'
      - 'Leader-run on the deployed preview env: `cargo run -p cli -- e2e credentials --env preview` calls api.anthropic.com from a sandbox with the key injected'
    verify:
      - 'cargo test -p hub --test credentials'
      - 'cd workers/workspace && npm ci && npx vitest run test/outbound'
      - 'cargo run -p cli -- e2e credentials --env preview'

