    milestone: M0
    priority: 1
    owner: human
    status: todo
    deps: []
    howto: >
      Run `sprite login` then `sprite org auth` locally (or create a token in the Sprites
      dashboard). Add it to this cloud environment's settings under Network secrets as
      SPRITES_API_TOKEN. Alternatively confirm whether a Fly org token (`fly tokens create org`)
      works against api.sprites.dev with the `FlyV1` scheme.
    acceptance:
      - "`curl -H \"Authorization: Bearer $SPRITES_API_TOKEN\" https://api.sprites.dev/v1/sprites` returns 200"
    verify: []

