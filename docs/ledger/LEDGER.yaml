# Work ledger for docs/PLAN-v2-ade.md (rev 6) — run with the `ledger` skill.
# Only the leader edits this file. Format: .claude/skills/ledger/reference/ledger-format.md
# Work is ordered by `phase` (P0..P7, plan §5), then milestone, then priority.
version: 1
plan: docs/PLAN-v2-ade.md
branch: v2
models: { default: haiku, high_risk_or_retry: sonnet, never: opus } # user cost policy 2026-10-28
max_parallel: 3 # Rust workers; the docs and client lanes add their own slots (see lanes)
lanes: { rust: 3, docs: 1, client: 1, ts: 1 } # per-lane in-flight caps; client (GPUI) is serialized
budget: # sized for P0–P2; the leader re-raises max_total_attempts at each phase review
  max_total_attempts: 120
  max_worker_minutes: 45
  max_worker_minutes_client: 60 # lane: client items
env:
  CARGO_TARGET_DIR: /home/user/.cargo-target-shared
  CARGO_BUILD_JOBS: '2'
  RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
  CARGO_INCREMENTAL: '0' # disk: the session's disk allowance is ~40 GB; incremental caches filled it (2026-10-28)
phase_order: [P0, P1, P2, P3, P4, P5, P6, P7]
milestone_order: [M0, M1a, M1b, M2, M2b, M3, M4, M5, M5c, M5b, M6]
items:
  # ════════════════════════ M0 — foundations, specs, tracer bullet; Workspace DO + sandbox spikes ════════════════════════
